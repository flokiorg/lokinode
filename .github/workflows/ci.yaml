name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-frontend:
    name: Build frontend (dist)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # Go code embeds frontend/dist (see lokinode.go), so any job that
    # builds/vets/lints/tests Go packages needs it to exist first. Built
    # once here and shared, instead of re-running pnpm in every Go job.
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Build (typecheck + vite build)
        working-directory: frontend
        run: pnpm run build

      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 1

  test-go:
    name: Go build, vet, test
    needs: build-frontend
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download frontend dist
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test (race)
        run: go test -race -count=1 ./...

  lint-go:
    name: golangci-lint
    needs: build-frontend
    runs-on: ubuntu-latest
    # Blocking: the pre-existing 45-issue backlog (errcheck/gosec/staticcheck/
    # unused/ineffassign/noctx/exhaustive) found on the first real run was
    # fully triaged and fixed across #4/#6/#8/#10/#12/#14. golangci-lint run
    # is 0 issues as of that point - flip back to continue-on-error: true
    # only if a future finding needs more than a quick fix and shouldn't
    # block merges in the meantime.
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download frontend dist
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.12.2

  security-go:
    name: govulncheck + gosec
    needs: build-frontend
    runs-on: ubuntu-latest
    # Blocking: baseline (15 govulncheck + 18 gosec findings) triaged and
    # fixed/suppressed. The 2 govulncheck findings with no upstream fix
    # (see .github/govulncheck-allowlist.txt) are explicitly allow-listed
    # rather than silenced with continue-on-error, so a genuinely new
    # reachable vulnerability still fails the build.
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download frontend dist
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: govulncheck
        run: |
          go run golang.org/x/vuln/cmd/govulncheck@latest -format json ./... > govulncheck.json

          # A finding is "reachable" (actually affects lokinode, not just an
          # imported-but-uncalled dependency) when its trace terminates back
          # in our own module.
          reachable=$(jq -r '
            select(.finding != null) | .finding |
            select((.trace | length) > 0) |
            select(.trace[-1].module == "github.com/flokiorg/lokinode") |
            .osv
          ' govulncheck.json | sort -u)

          allowed=$(grep -v '^\s*#' .github/govulncheck-allowlist.txt | grep -v '^\s*$' | sort -u)

          unexpected=$(comm -23 <(echo "$reachable") <(echo "$allowed") | sed '/^$/d')

          if [ -n "$reachable" ]; then
            echo "Reachable findings: $(echo "$reachable" | tr '\n' ' ')"
          else
            echo "No reachable findings."
          fi

          if [ -n "$unexpected" ]; then
            echo "::error::New reachable govulncheck finding(s) not in .github/govulncheck-allowlist.txt: $(echo "$unexpected" | tr '\n' ' ')"
            echo "Run 'go run golang.org/x/vuln/cmd/govulncheck@latest ./...' locally, fix what you can," \
                 "and add anything genuinely unfixable to .github/govulncheck-allowlist.txt with a reason."
            exit 1
          fi

          echo "Only allow-listed findings present (see .github/govulncheck-allowlist.txt) — OK."

      - name: gosec
        run: go run github.com/securego/gosec/v2/cmd/gosec@latest ./...
