name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-frontend:
    name: Build frontend (dist)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # Go code embeds frontend/dist (see lokinode.go), so any job that
    # builds/vets/lints/tests Go packages needs it to exist first. Built
    # once here and shared, instead of re-running pnpm in every Go job.
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Build (typecheck + vite build)
        working-directory: frontend
        run: pnpm run build

      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 1

  test-go:
    name: Go build, vet, test
    needs: build-frontend
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download frontend dist
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test (race)
        run: go test -race -count=1 ./...

  lint-go:
    name: golangci-lint
    needs: build-frontend
    runs-on: ubuntu-latest
    # Blocking: the pre-existing 45-issue backlog (errcheck/gosec/staticcheck/
    # unused/ineffassign/noctx/exhaustive) found on the first real run was
    # fully triaged and fixed across #4/#6/#8/#10/#12/#14. golangci-lint run
    # is 0 issues as of that point - flip back to continue-on-error: true
    # only if a future finding needs more than a quick fix and shouldn't
    # block merges in the meantime.
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download frontend dist
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.12.2

  security-go:
    name: govulncheck + gosec
    needs: build-frontend
    runs-on: ubuntu-latest
    # Non-blocking: first run establishes a baseline; revisit once triaged.
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download frontend dist
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

      - name: gosec
        run: go run github.com/securego/gosec/v2/cmd/gosec@latest ./...
