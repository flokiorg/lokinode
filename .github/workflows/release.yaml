name: Release

on:
  workflow_dispatch:

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get Latest Build-All Run ID
        id: get_run_ids
        uses: actions/github-script@v7
        with:
          script: |
            // linux.yaml/macos.yaml/windows.yaml are invoked as reusable
            // workflows (workflow_call) from build-all.yaml, so their runs
            // don't show up under their own workflow_id via listWorkflowRuns
            // - the whole thing is one run, owned by build-all.yaml, with
            // all three platforms' artifacts attached to that single run.
            const runs = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'build-all.yaml',
              status: 'success',
              per_page: 1,
            });

            const runId = runs.data.workflow_runs.length > 0 ? runs.data.workflow_runs[0].id : null;
            if (!runId) core.setFailed("No successful build-all.yaml runs found.");

            console.log(`build-all.yaml Run ID: ${runId}`);
            core.setOutput('run_id', runId);

      # VERSION stays the build-time input: it is go:embed-ed into the binary
      # (lokinode.go) and wails/http_test.go asserts the reported version keeps
      # its "v" prefix. CHANGELOG.md is the source of the release notes, and the
      # next step asserts the two agree so neither can be bumped alone.
      - name: Read Version
        id: version
        shell: bash
        run: |
          if [ ! -f VERSION ]; then
            echo "::error::VERSION file not found"
            exit 1
          fi
          TAG=$(cat VERSION | tr -d '[:space:]')
          if [ -z "$TAG" ]; then
            echo "::error::VERSION file is empty"
            exit 1
          fi
          echo "TAG=$TAG" >> $GITHUB_ENV

      - name: Resolve release notes from CHANGELOG.md
        shell: bash
        run: |
          TOP_HEADING=$(grep -m1 -oP '^## \[\K[^\]]+' CHANGELOG.md || true)
          if [ "$TOP_HEADING" = "Unreleased" ]; then
            echo "::error::Topmost CHANGELOG.md heading is '## [Unreleased]' - rename it to the version being released (e.g. '## [${{ env.TAG }}]') and commit that before running this workflow"
            exit 1
          fi
          if [ "$TOP_HEADING" != "${{ env.TAG }}" ]; then
            echo "::error::VERSION says '${{ env.TAG }}' but the topmost CHANGELOG.md heading is '$TOP_HEADING'. Bump both together."
            exit 1
          fi

          awk -v ver="${{ env.TAG }}" '
            $0 ~ "^## \\[" ver "\\]" { found=1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > /tmp/notes.raw

          # Trim leading/trailing blank lines.
          sed -e '/./,$!d' -e ':a' -e '/^\n*$/{$d;N;ba' -e '}' /tmp/notes.raw > /tmp/release-notes.md

          # Previously a missing note meant every later step was skipped and the
          # job still reported success, publishing nothing. Fail loudly instead.
          if [ ! -s /tmp/release-notes.md ]; then
            echo "::error::CHANGELOG.md has no content under '## [${{ env.TAG }}]'"
            exit 1
          fi

          echo "Releasing ${{ env.TAG }} with notes:"
          cat /tmp/release-notes.md

      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          run-id: ${{ steps.get_run_ids.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: artifacts

      - name: Display Artifacts
        run: ls -R artifacts

      # This job harvests artifacts from the most recent successful build-all
      # run rather than building them, so an older run would otherwise be
      # published silently under the new tag. Every asset carries the version in
      # its filename, which makes the mismatch cheap to detect.
      - name: Verify artifacts match the version being released
        shell: bash
        run: |
          FOUND=$(find artifacts -type f | wc -l)
          if [ "$FOUND" -eq 0 ]; then
            echo "::error::no artifacts were downloaded from the build-all run"
            exit 1
          fi

          MISMATCHED=$(find artifacts -type f ! -name "*${{ env.TAG }}*" || true)
          if [ -n "$MISMATCHED" ]; then
            echo "::error::the latest successful build-all run produced artifacts that do not carry ${{ env.TAG }} in their names - it predates this version. Re-run build-all.yaml, then this workflow."
            echo "$MISMATCHED"
            exit 1
          fi

          echo "All $FOUND artifacts carry ${{ env.TAG }}."

      - name: Delete Existing Tag
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            try {
              await github.rest.git.deleteRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: `tags/${{ env.TAG }}`
              });
              console.log('Deleted existing tag ${{ env.TAG }}');
            } catch (error) {
              if (error.status === 404) {
                console.log('Tag ${{ env.TAG }} does not exist, skipping deletion');
              } else {
                throw error;
              }
            }

      - name: Delete Existing Release
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            try {
              const releases = await github.rest.repos.listReleases({
                owner: context.repo.owner,
                repo: context.repo.repo,
              });
              const release = releases.data.find(r => r.tag_name === '${{ env.TAG }}');
              if (release) {
                await github.rest.repos.deleteRelease({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  release_id: release.id
                });
                console.log('Deleted existing release for ${{ env.TAG }}');
              } else {
                console.log('No existing release found for ${{ env.TAG }}');
              }
            } catch (error) {
              console.error('Error deleting release:', error.message);
            }

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ env.TAG }}
          name: Release ${{ env.TAG }}
          body_path: /tmp/release-notes.md
          files: artifacts/**/*
          fail_on_unmatched_files: false
          prerelease: ${{ contains(env.TAG, '-') }}
